name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Report tool versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        id: install
        run: npm ci --prefer-offline
      - name: Check SQLite native binding
        run: node -e "require('better-sqlite3')(':memory:').close()"
      - name: Lint backend and agent
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Build backend and typecheck frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          npm run typecheck:web > "$RUNNER_TEMP/web-types.log" 2>&1 &
          types_pid=$!
          result=0
          npm run build || result=1
          wait "$types_pid" || result=1
          cat "$RUNNER_TEMP/web-types.log"
          exit "$result"
      # Vite empties dist/frontend, which is also written by the backend compiler.
      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:web
