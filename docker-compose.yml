# Docker Compose >= 2.24. Start the complete application with:
#   docker compose up -d --build
# Add --profile observability to start the optional Langfuse stack too.
include:
  - docker-compose.op-stack.yml
  - docker-compose.docreader.yml

services:
  app:
    image: agentic-rag-app:local
    build:
      context: .
      target: backend
    env_file:
      - path: .env
        required: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      API_PORT: "3001"
      ES_NODE: http://elasticsearch:9200
      ES_API_KEY: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localpassword}
      DOCREADER_ADDR: docreader:50051
      SQLITE_PATH: /app/data/kefu-rag.db
      IMAGE_ASSET_PATH: /app/data/image-assets
      LOG_DIR: /app/logs
      PYTHON_COMMAND: /opt/venv/bin/python
      MARKITDOWN_COMMAND: /opt/venv/bin/markitdown
      # Settings use atomic rename, so persist the directory, not a .env bind file.
      # On restart the UI's saved provider settings override the original env_file.
      ENV_FILE: /app/data/model-settings.env
      DOTENV_CONFIG_PATH: /app/data/model-settings.env
      DOTENV_CONFIG_OVERRIDE: "true"
      # Default mode keeps the existing V2 promotion gate. Limited mode is
      # selected explicitly in the local .env / .env.example.
      MASTRA_PROMOTION_ARTIFACT: ${DOCKER_PROMOTION_ARTIFACT:-/app/release-artifacts/promotion.json}
      LANGFUSE_BASE_URL: ${DOCKER_LANGFUSE_BASE_URL:-http://langfuse:3000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ./.release-artifacts:/app/release-artifacts:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      docreader:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    cpus: 2.0
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: agentic-rag-web:local
    build:
      context: .
      target: web
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
  app-logs:
