SPECIFICATION Spec
CONSTANT MaxSends = 3

\* 发现 #1：dispose 后 failRun 的 promise 链仍存活（router.ts failRun 无 disposed 守卫），
\* dispose 与流错误竞态时旧 Router 会向新时间线发终结 chunk。
\* 本配置复现该违例；主 cfg（RouterLoopBuffering.cfg）保持绿门禁。
\* 用户裁决修复后（failRun 加 disposed 守卫），把 NoFinalAfterDispose 移回主 cfg。
PROPERTY NoFinalAfterDispose
